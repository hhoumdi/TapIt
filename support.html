<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;

            padding: 12px 24px;

<body>
    <div class="card">
        <h2>Card Issues / Unverified</h2>
        <p style="margin-top: 10px; color: #94a3b8; font-size: 14px;">This NFC card is either not verified or blocked. Please contact our support team for help.</p>
