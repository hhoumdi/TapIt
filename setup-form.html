<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Your NFC Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .form-card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="header">
            <h1>Setup Your Card</h1>
            <p>Enter your details below to activate your digital card.</p>
        </div>

        <form id="setupForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" class="form-control" placeholder="e.g. Hamza Houmdi" required>
            </div>

            <div class="form-group">
                <label>Profession / Title *</label>
                <input type="text" id="profession" class="form-control" placeholder="e.g. Software Engineer" required>
            </div>

            <div class="form-group">
                <label>Bio / Short Intro</label>
                <textarea id="bio" class="form-control" placeholder="Brief description about yourself..."></textarea>
            </div>

            <div class="form-group">
                <label>Profile Photo URL</label>
                <input type="url" id="photoUrl" class="form-control" placeholder="https://example.com/photo.jpg">
            </div>

            <div class="form-group">
                <label>Google Review Link</label>
                <input type="url" id="googleReview" class="form-control" placeholder="https://g.page/r/...">
            </div>

            <div class="form-group">
                <label>Website Link</label>
                <input type="url" id="website" class="form-control" placeholder="https://www.yourdomain.com">
            </div>

            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="text" id="whatsapp" class="form-control" placeholder="+212600000000">
            </div>

            <div class="form-group">
                <label>Instagram URL</label>
                <input type="url" id="instagram" class="form-control" placeholder="https://instagram.com/...">
            </div>

            <div class="form-group">
                <label>About Us / Work Overview</label>
                <textarea id="aboutUs" class="form-control" placeholder="Describe your business or services..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Activate Card</button>
        </form>
    </div>

    <script type="module">
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from "./config.js";

        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!cardId) {
                alert("Missing Card ID!");
                return;
            }

            const profileData = {
                card_id: cardId,
                status: "active",
                redirect_config: {
                    enable_auto_redirect: false,
                    target_type: "google_review",
                    custom_url: ""
                },
                personal_info: {
                    name: document.getElementById('fullName').value,
                    profession: document.getElementById('profession').value,
                    bio: document.getElementById('bio').value,
                    profile_photo_url: document.getElementById('photoUrl').value || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80"
                },
                links: {
                    google_review: document.getElementById('googleReview').value,
                    website: document.getElementById('website').value,
                    social_media: {
                        whatsapp: document.getElementById('whatsapp').value,
                        instagram: document.getElementById('instagram').value
                    }
                },
                work: {
                    about_us: document.getElementById('aboutUs').value
                },
                updated_at: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, "profiles", cardId), profileData, { merge: true });
                alert("Card Activated Successfully!");
                window.location.href = `index.html?id=${cardId}`;
            } catch (err) {
                console.error("Error activating card:", err);
                alert("Error saving data. Check console.");
            }
        });
    </script>
</body>
</html>
